name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and kernel build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Lint compiler modules
        run: |
          python3 -m pip install --disable-pip-version-check pyflakes==3.2.0
          python3 -m pyflakes lepton_*.py leptonc.py \
            tests/test_ir_verify.py tests/test_conversions.py tools/*.py

      - name: Compiler tests (scalar)
        run: make test

      - name: Compiler tests (SSE2)
        run: make test-sse

      - name: Userland builds (64-bit and 32-bit)
        run: make all

      - name: Kernel build (freestanding, 32-bit)
        run: make kernel

      - name: Kernel 64-bit compile check
        run: make kernel64-check

      - name: GGUF fixture references
        run: |
          mkdir -p build
          python3 tools/gen_gqa_gguf.py build/gqa.gguf
          python3 tools/verify_gqa.py build/gqa.gguf
          python3 tools/gen_merge_gguf.py build/merge.gguf
          python3 tools/verify_merge.py build/merge.gguf
          python3 tools/gen_q4k_gguf.py build/q4k.gguf
          python3 tools/verify_q4k.py build/q4k.gguf
          python3 tools/gen_q56_gguf.py 6 build/q5_0.gguf
          python3 tools/verify_q56.py build/q5_0.gguf
          python3 tools/gen_q56_gguf.py 7 build/q5_1.gguf
          python3 tools/verify_q56.py build/q5_1.gguf
          python3 tools/gen_q56_gguf.py 13 build/q5k.gguf
          python3 tools/verify_q56.py build/q5k.gguf
          python3 tools/gen_q56_gguf.py 14 build/q6k.gguf
          python3 tools/verify_q56.py build/q6k.gguf

# QEMU/inference smoke tests are intentionally not run here: they require
# qemu-system-i386 and a GGUF model, neither of which is tracked in Git.
# Run them locally with:
#   make run-kernel MODEL=models/tinystories.gguf
